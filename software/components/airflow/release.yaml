apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: airflow
  namespace: osdu-flux
spec:
  # Routes and ReferenceGrants target airflow-api-server, so the release
  # name must stay airflow rather than Flux's default platform-airflow.
  releaseName: airflow
  targetNamespace: platform
  interval: 30m
  timeout: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: airflow
      version: "1.22.*"
      sourceRef:
        kind: HelmRepository
        name: apache-airflow
  values:
    airflowVersion: "3.2.2"
    defaultAirflowRepository: ghcr.io/kiranbedre/osdu-spi-airflow
    defaultAirflowDigest: sha256:7a50601850488b35b8c257c4a062dbf5ce53c92c406c3fe578f027950f2ae67b
    images:
      pod_template:
        repository: ghcr.io/kiranbedre/osdu-spi-airflow@sha256
        tag: 7a50601850488b35b8c257c4a062dbf5ce53c92c406c3fe578f027950f2ae67b

    executor: KubernetesExecutor

    env:
      - name: AIRFLOW_VAR_OPENVDS_INGESTION_IMAGE
        value: ghcr.io/kiranbedre/osdu-spi-open-vds@sha256:4e5ae9565a864a1272010002ad01382810125839f38becd5ee2e3a8362f9fa2d
      - name: AIRFLOW_VAR_ZGY_CONVERTER_IMAGE
        value: ghcr.io/kiranbedre/osdu-spi-zgy-converter@sha256:91089d80ac2a8d7b5dada702b1e35d083be1f72bf82796570adde06a50794bfe
      - name: AIRFLOW_VAR_ZGY_CONVERTER_AUTH_SCOPE
        value: ${AAD_CLIENT_ID}/.default
      - name: AIRFLOW_VAR_CORE__SERVICE__SEISMIC__URL
        value: http://seismic.osdu.svc.cluster.local/seistore-svc/api/v3

    postgresql:
      enabled: false
    # KubernetesExecutor needs no broker; this also stops the chart rendering
    # an unused redis-password secret.
    redis:
      enabled: false
    data:
      metadataSecretName: airflow-metadata-secret

    # Signing material comes from the CLI-generated secret. Left unset, the
    # chart mints new api-secret/JWT keys on every render, invalidating
    # sessions and task tokens on each Flux reconcile.
    apiSecretKeySecretName: airflow-api-credentials
    jwtSecretName: airflow-api-credentials
    fernetKeySecretName: airflow-api-credentials

    workers:
      serviceAccount:
        create: false
        name: workload-identity-sa
      kubernetes:
        serviceAccount:
          create: false
          name: workload-identity-sa
      persistence:
        enabled: false
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 2Gi
      tolerations:
        - key: workload
          operator: Equal
          value: "platform"
          effect: NoSchedule
      nodeSelector:
        spi-pool: platform
      securityContexts:
        pod:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        container:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
    logs:
      persistence:
        enabled: false

    # useHelmHooks is per-job; without it Flux skips the hook-owned Job and
    # leaves the schema uninitialized.
    migrateDatabaseJob:
      enabled: true
      useHelmHooks: false
      serviceAccount:
        create: false
        name: workload-identity-sa
      resources:
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          memory: 512Mi
      tolerations:
        - key: workload
          operator: Equal
          value: "platform"
          effect: NoSchedule
      nodeSelector:
        spi-pool: platform
      securityContexts:
        pod:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        container:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL

    # The admin identity lives only in these args; the chart's defaultUser
    # block is ignored once args are overridden. 'users create' skips an
    # existing user, so 'reset-password' makes the secret's password win.
    createUserJob:
      useHelmHooks: false
      applyCustomEnv: false
      serviceAccount:
        create: false
        name: workload-identity-sa
      args:
        - "bash"
        - "-c"
        - |-
          airflow users create "$@" || true
          airflow users reset-password -u admin -p "$AIRFLOW_ADMIN_PW"
        - --
        - "-r"
        - "Admin"
        - "-u"
        - "admin"
        - "-e"
        - "admin@osdu.local"
        - "-f"
        - "OSDU"
        - "-l"
        - "Admin"
        - "-p"
        - "$(AIRFLOW_ADMIN_PW)"
      env:
        - name: AIRFLOW_ADMIN_PW
          valueFrom:
            secretKeyRef:
              name: airflow-api-credentials
              key: password
      resources:
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          memory: 512Mi
      tolerations:
        - key: workload
          operator: Equal
          value: "platform"
          effect: NoSchedule
      nodeSelector:
        spi-pool: platform
      securityContexts:
        pod:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        container:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL

    apiServer:
      serviceAccount:
        create: false
        name: workload-identity-sa
      replicas: 1
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 2Gi
      tolerations:
        - key: workload
          operator: Equal
          value: "platform"
          effect: NoSchedule
      nodeSelector:
        spi-pool: platform
      securityContexts:
        pod:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        container:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL

    scheduler:
      serviceAccount:
        create: false
        name: workload-identity-sa
      replicas: 1
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
      logGroomerSidecar:
        enabled: false
      tolerations:
        - key: workload
          operator: Equal
          value: "platform"
          effect: NoSchedule
      nodeSelector:
        spi-pool: platform
      securityContexts:
        pod:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        container:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL

    dagProcessor:
      serviceAccount:
        create: false
        name: workload-identity-sa
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      logGroomerSidecar:
        enabled: false
      tolerations:
        - key: workload
          operator: Equal
          value: "platform"
          effect: NoSchedule
      nodeSelector:
        spi-pool: platform
      securityContexts:
        pod:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        container:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL

    # Kept so deferrable operators remain available.
    triggerer:
      serviceAccount:
        create: false
        name: workload-identity-sa
      persistence:
        enabled: false
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      logGroomerSidecar:
        enabled: false
      tolerations:
        - key: workload
          operator: Equal
          value: "platform"
          effect: NoSchedule
      nodeSelector:
        spi-pool: platform
      securityContexts:
        pod:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        container:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL

    statsd:
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          memory: 128Mi
      tolerations:
        - key: workload
          operator: Equal
          value: "platform"
          effect: NoSchedule
      nodeSelector:
        spi-pool: platform
      securityContexts:
        pod:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        container:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL

    dags:
      persistence:
        enabled: true
        existingClaim: airflow-dags
      gitSync:
        enabled: false

    config:
      api:
        # Path-only: this becomes the FastAPI root_path, so the UI and API
        # serve under /airflow without a gateway rewrite. A scheme and host
        # here leak into the auth manager's login redirect, which urljoins
        # against this value, sending the browser off the gateway.
        base_url: "/airflow"
      kubernetes_executor:
        # Chart 1.22 has no worker digest value and joins repository:tag.
        # Splitting @sha256:<hex> across those fields preserves the digest.
        worker_container_repository: ghcr.io/kiranbedre/osdu-spi-airflow@sha256
        worker_container_tag: 7a50601850488b35b8c257c4a062dbf5ce53c92c406c3fe578f027950f2ae67b
