apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: osdu-spi-vds-dag
  namespace: osdu-flux
spec:
  targetNamespace: platform
  interval: 30m
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  chart:
    spec:
      chart: ./software/charts/osdu-spi-init
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: osdu-spi-stack-system
  valuesFrom:
    - kind: ConfigMap
      name: spi-init-values
      valuesKey: values.yaml
  values:
    coreEnabled: false
    legalEnabled: false
    membersEnabled: false
    workflowsEnabled: false
    namespace: platform
    dagDelivery:
      enabled: true
      serviceName: segy-to-vds-conversion
      artifact:
        reference: >-
          ghcr.io/kiranbedre/osdu-spi-vds-converter-dag@sha256:87d520c2dc631c0774074a96f527bb8fc53bc3c63b96d8c6594b9ec63e1d220b
        dagFile: dag.zip
        checksumFile: dag.zip.sha256
        workflowFile: workflow.json
      storage:
        claimName: airflow-dags-writer
        destination: services/segy-to-vds-conversion/vds_converter.zip
