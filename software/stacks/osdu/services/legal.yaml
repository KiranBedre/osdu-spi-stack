apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: legal
  namespace: osdu-flux
spec:
  targetNamespace: osdu
  dependsOn:
    - name: entitlements
  interval: 30m
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  chart:
    spec:
      chart: ./software/charts/osdu-spi-service
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: osdu-spi-stack-system
  values:
    replicaCount: 2
    hostAntiAffinity: true
    podDisruptionBudget:
      enabled: true
    image:
      repository: ${LEGAL_IMAGE_REPOSITORY}
      tag: "${LEGAL_IMAGE_TAG}"
      digest: "${LEGAL_IMAGE_DIGEST}"
    karpenter:
      doNotDisrupt: "${LEGAL_DO_NOT_DISRUPT:=false}"
    redisTls: true
    nodeSelector:
      spi-pool: osdu
    tolerations:
      - key: workload
        operator: Equal
        value: "osdu"
        effect: NoSchedule
      - key: kubernetes.azure.com/scalesetpriority
        operator: Equal
        value: "spot"
        effect: NoSchedule
    podSecurityContext:
      fsGroup: 1000
    initContainers:
      - name: install-java-runtime
        image: eclipse-temurin:25-jre-alpine
        command:
          - sh
          - -c
          - cp -R "$JAVA_HOME/." /java-runtime/
        volumeMounts:
          - name: java-runtime
            mountPath: /java-runtime
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
              - ALL
    volumeMounts:
      - name: java-runtime
        mountPath: /java-runtime
        readOnly: true
    volumes:
      - name: java-runtime
        emptyDir: {}
    env:
      # The upstream image currently carries Java 25 bytecode over a Java 17 base runtime.
      - name: JAVA_HOME
        value: /java-runtime
      - name: PATH
        value: /java-runtime/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - name: SPRING_APPLICATION_NAME
        value: legal
      - name: SERVER_SERVLET_CONTEXTPATH
        value: /api/legal/v1/
      - name: ACCEPT_HTTP
        value: "true"
      - name: AZURE_ISTIOAUTH_ENABLED
        value: "true"
      - name: AZURE_PAAS_WORKLOADIDENTITY_ISENABLED
        value: "true"
      - name: SPRING_CONFIG_NAME
        value: common,application
      - name: COSMOSDB_DATABASE
        value: osdu-db
      - name: AZURE_STORAGE_ENABLE_HTTPS
        value: "true"
      - name: AZURE_STORAGE_CONTAINER_NAME
        value: legal-service-azure-configuration
      - name: LEGAL_SERVICE_REGION
        value: us
      - name: SERVICEBUS_TOPIC_NAME
        value: legaltags
      # Gson serializes StatusChangedTag's raw Enum field by reflection; without this,
      # every tag-change publish fails.
      - name: JDK_JAVA_OPTIONS
        value: --add-opens java.base/java.lang=ALL-UNNAMED
      - name: REDIS_DATABASE
        value: "2"
      - name: PARTITION_SERVICE_ENDPOINT
        value: http://partition/api/partition/v1
      - name: ENTITLEMENTS_SERVICE_ENDPOINT
        value: http://entitlements/api/entitlements/v2
      - name: ENTITLEMENTS_SERVICE_API_KEY
        value: OBSOLETE
      # legal-azure's application.properties turns this off; the core default
      # and the acceptance suite expect it on.
      - name: FEATUREFLAG_LEGALTAGQUERYAPIFREETEXTALLFIELDS_ENABLED
        value: "true"
