apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: storage
  namespace: osdu-flux
spec:
  targetNamespace: osdu
  dependsOn:
    - name: legal
  interval: 30m
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  chart:
    spec:
      chart: ./software/charts/osdu-spi-service
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: osdu-spi-stack-system
  values:
    image:
      repository: ${STORAGE_IMAGE_REPOSITORY}
      tag: "${STORAGE_IMAGE_TAG}"
      digest: "${STORAGE_IMAGE_DIGEST}"
    karpenter:
      doNotDisrupt: "${STORAGE_DO_NOT_DISRUPT:=false}"
    redisTls: true
    nodeSelector:
      spi-pool: osdu
    tolerations:
      - key: workload
        operator: Equal
        value: "osdu"
        effect: NoSchedule
      - key: kubernetes.azure.com/scalesetpriority
        operator: Equal
        value: "spot"
        effect: NoSchedule
    istioProxyPin:
      enabled: true
    podSecurityContext:
      fsGroup: 1000
    initContainers:
      - name: install-java-runtime
        image: eclipse-temurin:25-jre-alpine
        command:
          - sh
          - -c
          - cp -R "$JAVA_HOME/." /java-runtime/
        volumeMounts:
          - name: java-runtime
            mountPath: /java-runtime
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
              - ALL
    volumeMounts:
      - name: java-runtime
        mountPath: /java-runtime
        readOnly: true
    volumes:
      - name: java-runtime
        emptyDir: {}
    env:
      # The upstream image currently carries Java 25 bytecode over a Java 17 base runtime.
      - name: JAVA_HOME
        value: /java-runtime
      - name: PATH
        value: /java-runtime/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - name: SPRING_APPLICATION_NAME
        value: storage
      - name: SERVER_SERVLET_CONTEXTPATH
        value: /api/storage/v2/
      - name: ACCEPT_HTTP
        value: "true"
      - name: AZURE_ISTIOAUTH_ENABLED
        value: "true"
      - name: AZURE_PAAS_WORKLOADIDENTITY_ISENABLED
        value: "true"
      - name: COSMOSDB_DATABASE
        value: osdu-db
      - name: AZURE_SERVICEBUS_ENABLED
        value: "true"
      - name: AZURE_EVENTGRID_ENABLED
        value: "false"
      - name: SERVICEBUS_TOPIC_NAME
        value: recordstopic
      - name: SERVICEBUS_V2_TOPIC_NAME
        value: recordstopic-v2
      - name: REDIS_DATABASE
        value: "4"
      - name: PARTITION_SERVICE_ENDPOINT
        value: http://partition/api/partition/v1
      - name: ENTITLEMENTS_SERVICE_ENDPOINT
        value: http://entitlements/api/entitlements/v2
      - name: ENTITLEMENTS_SERVICE_API_KEY
        value: OBSOLETE
      - name: LEGAL_SERVICE_ENDPOINT
        value: http://legal/api/legal/v1
      - name: LEGAL_SERVICE_REGION
        value: southcentralus
      # Legal publishes tag changes to legaltags; the *eg topic is only fed by Event Grid.
      - name: AZURE_FEATUREFLAG_LEGALTAGCOMPLIANCEUPDATEENABLED
        value: "true"
      - name: LEGAL_SERVICEBUS_TOPIC_NAME
        value: legaltags
      - name: LEGAL_SERVICEBUS_TOPIC_SUBSCRIPTION
        value: legaltagssubscription
      - name: CRS_CONVERSION_SERVICE_ENDPOINT
        value: http://crs-conversion/api/crs/converter/v2
      - name: POLICY_SERVICE_ENDPOINT
        value: http://policy/api/policy/v1
      - name: OPA_ENABLED
        value: "false"
